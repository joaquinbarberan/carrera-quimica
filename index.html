<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Carrera · Ing. Química</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2f8;
    --card: #ffffff;
    --ink: #2a1630;
    --muted: #7a6681;
    --line: #e7dcec;
    --purple: #5b1f6b;
    --purple-2: #7d3590;
    --lila: #efe4f3;
    --green: #2f9e6a;
    --green-bg: #e3f5ec;
    --amber: #c98a12;
    --amber-bg: #fdf3dd;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Outfit", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(135deg, var(--purple), var(--purple-2));
    color: #fff;
    padding: 40px 20px 90px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header small { opacity: .75; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
  header h1 { margin: 6px 0 0; font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1.05; }

  /* ---------- Resumen ---------- */
  .summary {
    margin: -60px auto 0;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(60, 20, 70, .12);
    padding: 24px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 28px;
    align-items: center;
  }
  .ring { position: relative; width: 150px; height: 150px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .track { stroke: var(--lila); }
  .ring .bar { stroke: var(--purple); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring .pct {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  }
  .ring .pct b { font-size: 34px; font-weight: 800; display: block; line-height: 1; }
  .ring .pct span { font-size: 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 14px; }
  .stat b { font-size: 26px; font-weight: 700; display: block; }
  .stat span { font-size: 13px; color: var(--muted); }
  .levels { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .lvl-bar span { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .lvl-bar div { height: 8px; background: var(--lila); border-radius: 99px; overflow: hidden; }
  .lvl-bar i { display: block; height: 100%; background: var(--purple); width: 0; transition: width .5s ease; }

  /* ---------- Controles ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    margin: 28px 0 8px;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 99px; font-size: 13px;
  }
  .filters button.on { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* ---------- Niveles ---------- */
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; padding-bottom: 60px; }
  .col h2 {
    margin: 0 0 10px; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    background: var(--purple); color: #fff; padding: 10px 14px; border-radius: 10px;
    display: flex; justify-content: space-between;
  }
  .col h2 small { font-weight: 500; opacity: .8; letter-spacing: 0; }

  .subj {
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 12px 12px 10px; margin-bottom: 10px; transition: border-color .2s, background .2s, opacity .2s;
  }
  .subj.cursada { border-color: var(--amber); background: var(--amber-bg); }
  .subj.aprobada { border-color: var(--green); background: var(--green-bg); }
  .subj.hidden { display: none; }
  .subj .top { display: flex; gap: 10px; align-items: flex-start; }
  .subj h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.25; flex: 1; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap;
    background: var(--lila); color: var(--purple);
  }
  .subj.cursada .badge { background: var(--amber); color: #fff; }
  .subj.aprobada .badge { background: var(--green); color: #fff; }
  .badge.locked { background: #eee; color: #999; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; }
  .seg button {
    border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 0; font-size: 12px; color: var(--muted);
  }
  .seg button.on[data-s="0"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg button.on[data-s="1"] { background: var(--amber); border-color: var(--amber); color: #fff; }
  .seg button.on[data-s="2"] { background: var(--green); border-color: var(--green); color: #fff; }

  .nota { display: none; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .subj.aprobada .nota { display: flex; }
  .nota input {
    width: 64px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px;
    color: var(--ink); background: #fff;
  }

  details { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; user-select: none; }
  details p { margin: 6px 0 0; line-height: 1.45; }
  details b { color: var(--ink); font-weight: 600; }
  .ok { color: var(--green); }
  .no { color: #c0392b; }

  .sync {
    display: none; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--line); font-size: 14px;
  }
  .sync.on { display: flex; }
  .sync .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #bbb; margin-right: 8px; vertical-align: middle; }
  .sync .dot.ok { background: var(--green); }
  .sync .dot.err { background: #c0392b; }
  .sync code { background: var(--lila); color: var(--purple); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .sync .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .sync .acts button {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 12px; border-radius: 99px; font-size: 13px;
  }

  .reset { border: none; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 99px; font-size: 14px;
    transition: transform .35s ease; z-index: 10; text-align: center; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 1050px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 680px) {
    .summary { grid-template-columns: 1fr; justify-items: center; padding: 20px 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); width: 100%; }
    .levels { grid-template-columns: 1fr; width: 100%; }
    .grid { grid-template-columns: 1fr; }
    .wrap { padding: 0 16px; }
    header { padding: 32px 16px 80px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <small>Ingeniería Química</small>
    <h1>Mi avance en la carrera</h1>
  </div>
</header>

<main class="wrap">
  <section class="summary">
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="track" cx="75" cy="75" r="62"/>
        <circle class="bar" id="ringBar" cx="75" cy="75" r="62"/>
      </svg>
      <div class="pct"><div><b id="pct">0%</b><span>de la carrera</span></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sAprob">0</b><span>Aprobadas</span></div>
      <div class="stat"><b id="sCurs">0</b><span>Cursadas (falta final)</span></div>
      <div class="stat"><b id="sFalta">0</b><span>Pendientes</span></div>
      <div class="stat"><b id="sProm">–</b><span>Promedio</span></div>
    </div>
    <div class="levels" id="levels"></div>
  </section>

  <div class="sync" id="sync">
    <div><span class="dot" id="syncDot"></span><span id="syncTxt">Conectando…</span></div>
    <div class="acts">
      <button id="syncLink">Copiar link para otro dispositivo</button>
      <button id="syncOtro">Usar otro código</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-f="all" class="on">Todas</button>
      <button data-f="disp">Puedo cursar</button>
      <button data-f="0">Pendientes</button>
      <button data-f="1">Cursadas</button>
      <button data-f="2">Aprobadas</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--amber)"></i>Cursada</span>
      <span><i style="background:var(--green)"></i>Aprobada</span>
      <button class="reset" id="reset">Reiniciar todo</button>
    </div>
  </div>

  <section class="grid" id="grid"></section>
</main>

<div class="toast" id="toast"></div>

<script>
/* Config de Firebase (Consola > Configuración del proyecto > Tus apps > Web).
   Mientras esté en null la página funciona igual, guardando solo en este dispositivo. */
const FIREBASE_CONFIG = null;

/* Plan de correlativas. c = para cursar necesita CURSADA, a = necesita APROBADA */
const PLAN = [
  { nivel: 1, materias: [
    { id: "am1",   n: "Análisis Matemático I" },
    { id: "aga",   n: "Álgebra y Geometría Analítica" },
    { id: "iys",   n: "Ingeniería y Sociedad" },
    { id: "iiq",   n: "Introducción a la Ingeniería Química" },
    { id: "sr",    n: "Sistemas de Representación" },
    { id: "qui",   n: "Química" },
    { id: "am2",   n: "Análisis Matemático II", c: ["am1", "aga"] },
    { id: "ing1",  n: "Inglés I" },
  ]},
  { nivel: 2, materias: [
    { id: "fis1",  n: "Física I" },
    { id: "qinorg",n: "Química Inorgánica", c: ["qui"] },
    { id: "iep",   n: "Introducción a Equipos y Procesos", c: ["iiq"] },
    { id: "qorg",  n: "Química Orgánica", c: ["qui"] },
    { id: "fis2",  n: "Física II", c: ["am1", "fis1"] },
    { id: "pye",   n: "Probabilidad y Estadística", c: ["am1", "aga"] },
    { id: "msa",   n: "Matemática Superior y Aplicada", c: ["am2"], a: ["am1", "aga"] },
    { id: "fi",    n: "Fundamentos de Informática" },
    { id: "ing2",  n: "Inglés II", c: ["ing1"] },
  ]},
  { nivel: 3, materias: [
    { id: "bme",   n: "Balances de Masa y Energía", c: ["iep", "qinorg", "fis1"], a: ["iiq", "am1", "qui"] },
    { id: "termo", n: "Termodinámica", c: ["iep", "am2", "fis2"], a: ["am1", "qui"] },
    { id: "leg",   n: "Legislación", c: ["iiq", "iys"] },
    { id: "cmat",  n: "Ciencia de los Materiales", c: ["iep", "qinorg"], a: ["iiq", "qui"] },
    { id: "fq",    n: "Fisicoquímica", c: ["iep", "am2", "fis2"], a: ["am1", "aga", "qui"] },
    { id: "ft",    n: "Fenómenos de Transporte", c: ["iep", "am2", "fis2"], a: ["am1", "aga"] },
    { id: "qan",   n: "Química Analítica", c: ["pye", "qinorg", "qorg"], a: ["iys", "qui"] },
    { id: "mqb",   n: "Microbiología y Química Biológica", c: ["qinorg", "qorg"], a: ["qui"] },
    { id: "qap",   n: "Química Aplicada", c: ["iep", "qinorg", "fis2", "qorg"], a: ["iiq", "iys", "qui"] },
    { id: "eco",   n: "Economía", c: ["iep"], a: ["aga", "iys"] },
  ]},
  { nivel: 4, materias: [
    { id: "dsosp", n: "Diseño, Simulación, Optimización y Seguridad de Procesos", c: ["bme", "msa"], a: ["sr", "fi", "iep", "am2", "ing2"] },
    { id: "ou1",   n: "Operaciones Unitarias I", c: ["bme", "ft"], a: ["iep", "am2", "fis1"] },
    { id: "tet",   n: "Tecnología de la Energía Térmica", c: ["bme", "termo", "fq", "ft"], a: ["iep", "am2", "fis2"] },
    { id: "irq",   n: "Ingeniería de las Reacciones Químicas", c: ["bme", "termo", "fq", "ft"], a: ["qinorg", "am2", "qorg"] },
    { id: "ou2",   n: "Operaciones Unitarias II", c: ["termo", "fq", "ft"], a: ["iep", "am2", "fis2", "qorg"] },
    { id: "pbio",  n: "Procesos Biotecnológicos", c: ["bme", "fq", "ft", "mqb"], a: ["iep", "qinorg", "qorg"] },
    { id: "oi",    n: "Organización Industrial", c: ["pye"], a: ["iys", "iep", "leg"] },
    { id: "hyst",  n: "Higiene y Seguridad en el Trabajo", c: ["qinorg", "qorg", "bme"], a: ["iep"] },
  ]},
  { nivel: 5, materias: [
    { id: "cap",   n: "Control Automático de Procesos", c: ["dsosp", "ou2"], a: ["bme", "msa", "qan"] },
    { id: "mi",    n: "Mecánica Industrial", c: ["iep", "fq"], a: ["fis1", "qinorg", "cmat"] },
    { id: "iamb",  n: "Ingeniería Ambiental", c: ["qap", "ou1", "ou2", "irq"], a: ["leg", "bme", "qan"] },
    { id: "ccep",  n: "Calidad y Control Estadístico de Procesos", c: ["pye"], a: ["am1"] },
    { id: "mie",   n: "Máquinas e Instalaciones Eléctricas", c: ["ou1"], a: ["iep", "fis2"] },
    { id: "pf",    n: "Proyecto Final", c: ["dsosp", "ou1", "tet", "ou2", "irq", "oi"], a: ["bme", "fq", "ft", "qap", "eco"] },
  ]},
];

const ALL = PLAN.flatMap(p => p.materias.map(m => ({ ...m, nivel: p.nivel })));
const BY_ID = Object.fromEntries(ALL.map(m => [m.id, m]));
const ROMAN = ["", "I", "II", "III", "IV", "V"];
const LABEL = ["Pendiente", "Cursada", "Aprobada"];
const KEY = "carrera-iq-v1";

/* estado: { id: { s: 0|1|2, nota: "" } } */
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  Sync.push();
};
const st = id => (state[id] && state[id].s) || 0;

let filter = "all";

function puedeCursar(m) {
  return (m.c || []).every(id => st(id) >= 1) && (m.a || []).every(id => st(id) === 2);
}

function reqList(ids, min) {
  if (!ids || !ids.length) return "Ninguna";
  return ids.map(id => {
    const ok = st(id) >= min;
    return `<span class="${ok ? "ok" : "no"}">${ok ? "✓" : "✗"} ${BY_ID[id].n}</span>`;
  }).join(" · ");
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = PLAN.map(p => {
    const aprob = p.materias.filter(m => st(m.id) === 2).length;
    return `<div class="col">
      <h2>Nivel ${ROMAN[p.nivel]} <small>${aprob}/${p.materias.length}</small></h2>
      ${p.materias.map(m => card({ ...m, nivel: p.nivel })).join("")}
    </div>`;
  }).join("");
  updateSummary();
}

function card(m) {
  const s = st(m.id);
  const disp = puedeCursar(m);
  const nota = (state[m.id] && state[m.id].nota) || "";
  const cls = ["", "cursada", "aprobada"][s];
  let badge = `<span class="badge">${LABEL[s]}</span>`;
  if (s === 0) badge = disp ? `<span class="badge">Disponible</span>` : `<span class="badge locked">Bloqueada</span>`;

  let hidden = false;
  if (filter === "disp") hidden = !(s === 0 && disp);
  else if (filter !== "all") hidden = String(s) !== filter;

  return `<article class="subj ${cls} ${hidden ? "hidden" : ""}" data-id="${m.id}">
    <div class="top"><h3>${m.n}</h3>${badge}</div>
    <div class="seg">
      ${[0, 1, 2].map(i => `<button data-s="${i}" class="${s === i ? "on" : ""}">${LABEL[i]}</button>`).join("")}
    </div>
    <label class="nota">Nota final:
      <input type="number" min="1" max="10" step="0.5" value="${nota}" placeholder="–">
    </label>
    <details>
      <summary>Correlativas</summary>
      <p><b>Cursada:</b> ${reqList(m.c, 1)}</p>
      <p><b>Aprobada:</b> ${reqList(m.a, 2)}</p>
    </details>
  </article>`;
}

function updateSummary() {
  const total = ALL.length;
  const aprob = ALL.filter(m => st(m.id) === 2);
  const curs = ALL.filter(m => st(m.id) === 1).length;
  const pct = Math.round((aprob.length / total) * 100);

  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("sAprob").textContent = `${aprob.length}/${total}`;
  document.getElementById("sCurs").textContent = curs;
  document.getElementById("sFalta").textContent = total - aprob.length - curs;

  const notas = aprob.map(m => parseFloat(state[m.id].nota)).filter(n => !isNaN(n));
  document.getElementById("sProm").textContent =
    notas.length ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(2) : "–";

  const r = 62, circ = 2 * Math.PI * r;
  const bar = document.getElementById("ringBar");
  bar.style.strokeDasharray = circ;
  bar.style.strokeDashoffset = circ * (1 - aprob.length / total);

  document.getElementById("levels").innerHTML = PLAN.map(p => {
    const a = p.materias.filter(m => st(m.id) === 2).length;
    const t = p.materias.length;
    return `<div class="lvl-bar"><span><b>Nivel ${ROMAN[p.nivel]}</b>${a}/${t}</span><div><i style="width:${(a / t) * 100}%"></i></div></div>`;
  }).join("");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

document.getElementById("grid").addEventListener("click", e => {
  const btn = e.target.closest(".seg button");
  if (!btn) return;
  const id = btn.closest(".subj").dataset.id;
  const s = Number(btn.dataset.s);
  const antes = ALL.filter(m => st(m.id) === 2).length;
  state[id] = { ...(state[id] || {}), s };
  if (s !== 2 && state[id]) delete state[id].nota;
  save();
  render();
  if (s === 2) {
    const ahora = ALL.filter(m => st(m.id) === 2).length;
    if (ahora > antes) {
      const pct = Math.round((ahora / ALL.length) * 100);
      toast(ahora === ALL.length ? "🎓 ¡Ingeniera Química! 100% completado" : `🎉 ¡${BY_ID[id].n} aprobada! Ya vas ${pct}%`);
    }
  }
});

document.getElementById("grid").addEventListener("input", e => {
  if (!e.target.matches(".nota input")) return;
  const id = e.target.closest(".subj").dataset.id;
  state[id] = { ...(state[id] || { s: 2 }), nota: e.target.value };
  save();
  updateSummary();
});

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("¿Borrar todo el progreso guardado?")) return;
  state = {};
  save();
  render();
});

/* ---------- Sincronización (Firestore) ----------
   Cada progreso vive en progreso/{código}. El código es aleatorio y funciona como llave:
   quien lo tenga puede ver y editar ese progreso. */
const Sync = {
  ref: null, setDoc: null, codigo: null, timer: null,
  CODE_KEY: "carrera-iq-sync",

  nuevoCodigo() {
    const abc = "abcdefghjkmnpqrstuvwxyz23456789";
    const r = crypto.getRandomValues(new Uint8Array(10));
    const s = [...r].map(n => abc[n % abc.length]).join("");
    return s.slice(0, 5) + "-" + s.slice(5);
  },

  estado(txt, tipo) {
    document.getElementById("syncTxt").innerHTML = txt;
    document.getElementById("syncDot").className = "dot " + (tipo || "");
  },

  push() {
    if (!this.ref) return;
    clearTimeout(this.timer);
    // pequeña espera para no escribir en cada tecla de la nota
    this.timer = setTimeout(() => {
      this.setDoc(this.ref, { estado: state, t: Date.now() })
        .then(() => this.estado(`Sincronizado · código <code>${this.codigo}</code>`, "ok"))
        .catch(() => this.estado("No se pudo sincronizar (se guardó en este dispositivo)", "err"));
    }, 400);
  },

  async init() {
    if (!FIREBASE_CONFIG) return;
    document.getElementById("sync").classList.add("on");

    // ?sync=CODIGO en la URL conecta este dispositivo a ese progreso
    const url = new URL(location.href);
    const desdeLink = url.searchParams.get("sync");
    if (desdeLink) {
      url.searchParams.delete("sync");
      history.replaceState(null, "", url);
    }
    let codigo = desdeLink;
    try { codigo = codigo || localStorage.getItem(this.CODE_KEY); } catch (e) {}
    codigo = codigo || this.nuevoCodigo();
    try { localStorage.setItem(this.CODE_KEY, codigo); } catch (e) {}
    this.codigo = codigo;

    try {
      const V = "10.12.2";
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const db = fs.getFirestore(initializeApp(FIREBASE_CONFIG));
      const ref = fs.doc(db, "progreso", codigo);
      this.setDoc = fs.setDoc;

      const snap = await fs.getDoc(ref);
      this.ref = ref;
      if (snap.exists()) {
        state = snap.data().estado || {};
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        render();
      } else {
        this.push(); // primera vez: sube lo que haya en este dispositivo
      }
      this.estado(`Sincronizado · código <code>${codigo}</code>`, "ok");

      // cambios hechos desde otro dispositivo
      fs.onSnapshot(ref, s => {
        if (s.metadata.hasPendingWrites || !s.exists()) return;
        const remoto = s.data().estado || {};
        if (JSON.stringify(remoto) === JSON.stringify(state)) return;
        if (document.activeElement && document.activeElement.matches(".nota input")) return;
        state = remoto;
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        render();
      });
    } catch (e) {
      this.ref = null;
      this.estado("Sin conexión: se guarda en este dispositivo", "err");
    }
  },
};

document.getElementById("syncLink").addEventListener("click", async () => {
  const link = `${location.origin}${location.pathname}?sync=${Sync.codigo}`;
  try { await navigator.clipboard.writeText(link); toast("Link copiado. Abrilo en el otro dispositivo"); }
  catch (e) { prompt("Copiá este link y abrilo en el otro dispositivo:", link); }
});

document.getElementById("syncOtro").addEventListener("click", () => {
  const c = (prompt("Pegá el código del otro dispositivo (ej: abcde-23456):") || "").trim().toLowerCase();
  if (!/^[a-z0-9]{5}-[a-z0-9]{5}$/.test(c)) { if (c) toast("Ese código no tiene el formato correcto"); return; }
  if (!confirm("Se va a reemplazar el progreso de este dispositivo por el de ese código. ¿Seguir?")) return;
  try { localStorage.setItem(Sync.CODE_KEY, c); } catch (e) {}
  location.reload();
});

render();
Sync.init();
</script>
</body>
</html>
